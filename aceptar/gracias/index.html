<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceptance received · TANSI Tours</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-sans text-darkText antialiased bg-softOffWhite min-h-screen flex flex-col">

  <div class="bg-white border-b border-gray-100 py-3 px-4 flex justify-end">
    <div class="flex rounded-full border border-gray-200 overflow-hidden text-xs font-bold" role="group" aria-label="Language">
      <button type="button" id="btn-lang-en" class="px-3 py-1.5 transition-colors bg-primary text-white">EN</button>
      <button type="button" id="btn-lang-es" class="px-3 py-1.5 transition-colors text-lightText hover:bg-gray-50">ES</button>
    </div>
  </div>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="max-w-lg w-full bg-white rounded-2xl shadow-premium border border-gray-100 p-8 md:p-10 text-center">
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
        <i data-lucide="check-circle" class="w-9 h-9 text-green-600"></i>
      </div>
      <h1 data-i18n="thanksTitle" class="text-2xl font-bold text-primary mb-3"></h1>
      <p data-i18n-html="thanksSub" class="text-lightText text-sm leading-relaxed mb-6"></p>
      <div class="bg-accent/5 border border-accent/30 rounded-xl p-4 text-sm text-darkText mb-8 text-left space-y-2">
        <p class="flex gap-2"><span class="text-accent font-bold">1.</span><span data-i18n="thanksStep1"></span></p>
        <p class="flex gap-2"><span class="text-accent font-bold">2.</span><span data-i18n="thanksStep2"></span></p>
        <p class="flex gap-2"><span class="text-accent font-bold">3.</span><span data-i18n="thanksStep3"></span></p>
      </div>
      <a id="wa-link" href="#" target="_blank"
         class="inline-flex items-center justify-center gap-2 bg-[#25D366] hover:bg-[#20bd5a] text-white font-bold py-4 px-8 rounded-full transition-all w-full mb-4">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.878-.788-1.47-1.761-1.643-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
        <span data-i18n="thanksWa"></span>
      </a>
      <a href="/" data-i18n="thanksHome" class="text-sm text-lightText hover:text-primary transition-colors"></a>
    </div>
  </main>

  <footer class="bg-[#0f172a] text-gray-500 text-center py-6 text-xs">
    <p>TANSI Tours · +57 323 390 9989</p>
  </footer>

  <script src="/aceptar/i18n.js"></script>
  <script>
    lucide.createIcons();

    function applyThanks(lang) {
      const t = TANSI_I18N[lang];
      document.documentElement.lang = lang;
      document.title = t.thanksPageTitle;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key] !== undefined) el.textContent = t[key];
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const key = el.getAttribute('data-i18n-html');
        if (t[key] !== undefined) el.innerHTML = t[key];
      });
      document.getElementById('wa-link').href =
        'https://wa.me/573233909989?text=' + encodeURIComponent(t.thanksWaText);
      document.getElementById('btn-lang-en').classList.toggle('bg-primary', lang === 'en');
      document.getElementById('btn-lang-en').classList.toggle('text-white', lang === 'en');
      document.getElementById('btn-lang-en').classList.toggle('text-lightText', lang !== 'en');
      document.getElementById('btn-lang-es').classList.toggle('bg-primary', lang === 'es');
      document.getElementById('btn-lang-es').classList.toggle('text-white', lang === 'es');
      document.getElementById('btn-lang-es').classList.toggle('text-lightText', lang !== 'es');
      localStorage.setItem('tansi-lang', lang);
    }

    let lang = TANSI_getLang();
    applyThanks(lang);

    document.getElementById('btn-lang-en').addEventListener('click', function () {
      lang = 'en'; applyThanks(lang);
      history.replaceState(null, '', '?lang=en');
    });
    document.getElementById('btn-lang-es').addEventListener('click', function () {
      lang = 'es'; applyThanks(lang);
      history.replaceState(null, '', '?lang=es');
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Acceptance · TANSI Tours</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    details.clausula > summary { list-style: none; cursor: pointer; }
    details.clausula > summary::-webkit-details-marker { display: none; }
    details.clausula[open] .chevron { transform: rotate(180deg); }
  </style>
</head>
<body class="font-sans text-darkText antialiased bg-softOffWhite selection:bg-accent selection:text-white">

  <nav class="bg-white border-b border-gray-100 shadow-sm sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
      <a href="/" class="flex items-center shrink-0">
        <img src="/logo-header.png" alt="TANSI Tours" class="h-10 md:h-12 w-auto"
             onerror="this.outerHTML='<span class=\'text-xl font-bold text-primary\'>TANSI<span class=\'text-accent\'>.</span>Tours</span>'">
      </a>
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="flex rounded-full border border-gray-200 overflow-hidden text-xs font-bold shrink-0" role="group" aria-label="Language">
          <button type="button" id="btn-lang-en" class="px-3 py-1.5 transition-colors bg-primary text-white">EN</button>
          <button type="button" id="btn-lang-es" class="px-3 py-1.5 transition-colors text-lightText hover:bg-gray-50">ES</button>
        </div>
        <span data-i18n="navBadge" class="text-xs font-semibold uppercase tracking-wider text-accent bg-accent/10 px-3 py-1.5 rounded-full hidden md:inline"></span>
      </div>
    </div>
  </nav>

  <header class="bg-gradient-to-br from-primary to-[#37474F] text-white">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-10 md:py-14">
      <p data-i18n="heroKicker" class="text-accent font-semibold text-sm uppercase tracking-widest mb-3"></p>
      <h1 class="text-2xl md:text-3xl font-bold leading-tight mb-4">
        <span data-i18n="heroTitle"></span><br>
        <span data-i18n="heroTitleAccent" class="text-accent"></span>
      </h1>
      <p data-i18n="heroSub" class="text-white/90 text-sm md:text-base max-w-2xl leading-relaxed"></p>
      <p id="ref-badge" class="hidden mt-4 inline-flex items-center gap-2 bg-white/10 border border-white/20 rounded-full px-4 py-2 text-sm">
        <i data-lucide="hash" class="w-4 h-4 text-accent"></i>
        Ref: <span id="ref-display" class="font-semibold"></span>
      </p>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 md:py-12 space-y-8">

    <section class="bg-white rounded-2xl shadow-premium border border-gray-100 p-6 md:p-8">
      <div class="flex items-center gap-2 mb-4">
        <span class="w-8 h-0.5 bg-accent"></span>
        <h2 data-i18n="summaryTitle" class="text-xs font-bold uppercase tracking-widest text-accent"></h2>
      </div>
      <p data-i18n-html="summaryIntro" class="text-sm text-lightText mb-6"></p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
        <div class="bg-softOffWhite rounded-xl p-4 border border-gray-100">
          <span data-i18n="lblPackage" class="text-xs font-bold uppercase tracking-wide text-lightText"></span>
          <p id="preview-paquete" class="font-semibold text-primary mt-1">—</p>
        </div>
        <div class="bg-softOffWhite rounded-xl p-4 border border-gray-100">
          <span data-i18n="lblTotal" class="text-xs font-bold uppercase tracking-wide text-lightText"></span>
          <p id="preview-valor" class="font-semibold text-primary mt-1">—</p>
        </div>
        <div class="bg-softOffWhite rounded-xl p-4 border border-gray-100">
          <span data-i18n="lblPassengers" class="text-xs font-bold uppercase tracking-wide text-lightText"></span>
          <p id="preview-pasajeros" class="font-semibold text-primary mt-1">—</p>
        </div>
        <div class="bg-softOffWhite rounded-xl p-4 border border-gray-100">
          <span data-i18n="lblDates" class="text-xs font-bold uppercase tracking-wide text-lightText"></span>
          <p id="preview-fechas" class="font-semibold text-primary mt-1">—</p>
        </div>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow-premium border border-gray-100 p-6 md:p-8">
      <div class="flex items-center gap-2 mb-2">
        <span class="w-8 h-0.5 bg-accent"></span>
        <h2 data-i18n="clausesTitle" class="text-xs font-bold uppercase tracking-widest text-accent"></h2>
      </div>
      <p data-i18n="clausesHint" class="text-sm text-lightText mb-6"></p>
      <div class="space-y-3" id="clausulas"></div>
      <div class="mt-6 bg-accent/5 border border-accent/30 rounded-xl p-5">
        <h3 data-i18n="paymentTitle" class="font-semibold text-primary text-sm mb-3"></h3>
        <ul class="space-y-2 text-sm text-darkText">
          <li class="flex gap-2"><span class="text-accent font-bold">•</span><span data-i18n-html="payment1"></span></li>
          <li class="flex gap-2"><span class="text-accent font-bold">•</span><span data-i18n-html="payment2"></span></li>
          <li class="flex gap-2"><span class="text-accent font-bold">•</span><span data-i18n-html="payment3"></span></li>
        </ul>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow-premium border border-gray-100 p-6 md:p-8" id="formulario">
      <div class="flex items-center gap-2 mb-2">
        <span class="w-8 h-0.5 bg-accent"></span>
        <h2 data-i18n="formTitle" class="text-xs font-bold uppercase tracking-widest text-accent"></h2>
      </div>
      <p data-i18n="formHint" class="text-sm text-lightText mb-6"></p>

      <form id="aceptar-form" method="POST" action="https://formspree.io/f/xyeylnrv" class="space-y-6">
        <input type="hidden" name="_subject" value="New contract acceptance — TANSI Tours">
        <input type="hidden" name="_language" value="en">
        <input type="hidden" name="idioma" id="field-idioma" value="en">
        <input type="hidden" name="canal" value="web-tansitours.lat/aceptar">
        <input type="hidden" name="url_aceptacion" id="field-url">
        <input type="hidden" name="fecha_hora_aceptacion" id="field-timestamp">
        <input type="hidden" name="ref_reserva" id="field-ref">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="nombre" data-i18n="lblName" class="block text-xs font-bold uppercase tracking-wide text-lightText mb-2"></label>
            <input type="text" id="nombre" name="nombre" required autocomplete="name"
                   data-i18n-placeholder="phName"
                   class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-darkText placeholder:text-lightText focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
          </div>
          <div>
            <label for="cedula" data-i18n="lblId" class="block text-xs font-bold uppercase tracking-wide text-lightText mb-2"></label>
            <input type="text" id="cedula" name="cedula" required
                   data-i18n-placeholder="phId"
                   class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-darkText placeholder:text-lightText focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
          </div>
          <div>
            <label for="telefono" data-i18n="lblPhone" class="block text-xs font-bold uppercase tracking-wide text-lightText mb-2"></label>
            <input type="tel" id="telefono" name="telefono" required autocomplete="tel"
                   data-i18n-placeholder="phPhone"
                   class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-darkText placeholder:text-lightText focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
          </div>
          <div>
            <label for="email" data-i18n="lblEmail" class="block text-xs font-bold uppercase tracking-wide text-lightText mb-2"></label>
            <input type="email" id="email" name="email" required autocomplete="email"
                   data-i18n-placeholder="phEmail"
                   class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-darkText placeholder:text-lightText focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="sm:col-span-2">
            <label for="paquete" data-i18n="lblPackageField" class="block text-xs font-bold uppercase tracking-wide text-lightText mb-2"></label>
            <input type="text" id="paquete" name="paquete" required
                   data-i18n-placeholder="phPackage"
                   class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-darkText placeholder:text-lightText focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
          </div>
          <div>
            <label for="pasajeros" data-i18n="lblPassengersField" class="block text-xs font-bold uppercase tracking-wide text-lightText mb-2"></label>
            <input type="number" id="pasajeros" name="pasajeros" required min="1" max="20" placeholder="4"
                   class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-darkText placeholder:text-lightText focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
          </div>
          <div>
            <label for="fechas" data-i18n="lblDatesField" class="block text-xs font-bold uppercase tracking-wide text-lightText mb-2"></label>
            <input type="text" id="fechas" name="fechas" required
                   data-i18n-placeholder="phDates"
                   class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-darkText placeholder:text-lightText focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
          </div>
          <div>
            <label for="valor_total" data-i18n="lblTotalField" class="block text-xs font-bold uppercase tracking-wide text-lightText mb-2"></label>
            <input type="text" id="valor_total" name="valor_total" required
                   data-i18n-placeholder="phTotal"
                   class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-darkText placeholder:text-lightText focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
          </div>
        </div>

        <div class="space-y-3 pt-2">
          <p data-i18n="checkIntro" class="text-xs font-bold uppercase tracking-wide text-lightText"></p>
          <label class="flex items-start gap-3 p-3 rounded-xl border border-gray-100 hover:bg-softOffWhite cursor-pointer transition-colors">
            <input type="checkbox" name="acepta_intermediacion" value="Yes" required class="mt-1 w-4 h-4 accent-primary shrink-0">
            <span data-i18n-html="check1" class="text-sm"></span>
          </label>
          <label class="flex items-start gap-3 p-3 rounded-xl border border-gray-100 hover:bg-softOffWhite cursor-pointer transition-colors">
            <input type="checkbox" name="acepta_noshow" value="Yes" required class="mt-1 w-4 h-4 accent-primary shrink-0">
            <span data-i18n-html="check2" class="text-sm"></span>
          </label>
          <label class="flex items-start gap-3 p-3 rounded-xl border border-gray-100 hover:bg-softOffWhite cursor-pointer transition-colors">
            <input type="checkbox" name="acepta_cancelacion" value="Yes" required class="mt-1 w-4 h-4 accent-primary shrink-0">
            <span data-i18n-html="check3" class="text-sm"></span>
          </label>
          <label class="flex items-start gap-3 p-3 rounded-xl border border-gray-100 hover:bg-softOffWhite cursor-pointer transition-colors">
            <input type="checkbox" name="acepta_seguro" value="Yes" required class="mt-1 w-4 h-4 accent-primary shrink-0">
            <span data-i18n-html="check4" class="text-sm"></span>
          </label>
          <label class="flex items-start gap-3 p-3 rounded-xl border border-gray-100 hover:bg-softOffWhite cursor-pointer transition-colors">
            <input type="checkbox" name="acepta_operativo" value="Yes" required class="mt-1 w-4 h-4 accent-primary shrink-0">
            <span data-i18n-html="check5" class="text-sm"></span>
          </label>
          <label class="flex items-start gap-3 p-3 rounded-xl border border-gray-100 hover:bg-softOffWhite cursor-pointer transition-colors">
            <input type="checkbox" name="acepta_ley679" value="Yes" required class="mt-1 w-4 h-4 accent-primary shrink-0">
            <span data-i18n-html="check6" class="text-sm"></span>
          </label>
          <label class="flex items-start gap-3 p-3 rounded-xl border border-gray-100 hover:bg-softOffWhite cursor-pointer transition-colors">
            <input type="checkbox" name="acepta_datos" value="Yes" required class="mt-1 w-4 h-4 accent-primary shrink-0">
            <span data-i18n-html="check7" class="text-sm"></span>
          </label>
          <label class="flex items-start gap-3 p-3 rounded-xl border border-gray-100 hover:bg-softOffWhite cursor-pointer transition-colors">
            <input type="checkbox" name="acepta_firma_electronica" value="Yes" required class="mt-1 w-4 h-4 accent-primary shrink-0">
            <span data-i18n-html="check8" class="text-sm"></span>
          </label>
          <label class="flex items-start gap-3 p-3 rounded-xl border border-gray-100 hover:bg-softOffWhite cursor-pointer transition-colors">
            <input type="checkbox" name="acepta_pago" value="Yes" required class="mt-1 w-4 h-4 accent-primary shrink-0">
            <span data-i18n-html="check9" class="text-sm"></span>
          </label>
        </div>

        <div>
          <label for="firma_electronica" data-i18n="lblSignature" class="block text-xs font-bold uppercase tracking-wide text-lightText mb-2"></label>
          <input type="text" id="firma_electronica" name="firma_electronica" required
                 data-i18n-placeholder="phSignature"
                 class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-darkText font-semibold placeholder:text-lightText focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
          <p data-i18n="signatureNote" class="text-xs text-lightText mt-2"></p>
        </div>

        <button type="submit" id="submit-btn"
                class="w-full bg-accent hover:bg-accentHover text-white font-bold py-4 px-8 rounded-full text-base transition-all transform hover:scale-[1.02] shadow-[0_10px_20px_-10px_rgba(245,158,11,0.5)] flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
          <i data-lucide="pen-line" class="w-5 h-5"></i>
          <span data-i18n="submitBtn"></span>
        </button>
      </form>
    </section>

  </main>

  <footer class="bg-[#0f172a] text-gray-400 text-center py-8 text-xs">
    <p class="text-white font-semibold mb-1">TANSI Tours · Juan David Gómez · +57 323 390 9989</p>
    <p data-i18n="footerTagline"></p>
  </footer>

  <script src="/aceptar/i18n.js"></script>
  <script>
    lucide.createIcons();

    const form = document.getElementById('aceptar-form');
    const params = new URLSearchParams(window.location.search);
    let currentLang = TANSI_getLang();

    document.getElementById('btn-lang-en').addEventListener('click', function () { TANSI_setLang('en'); updateNextUrl(); refreshPreviewEmpty(); });
    document.getElementById('btn-lang-es').addEventListener('click', function () { TANSI_setLang('es'); updateNextUrl(); refreshPreviewEmpty(); });

    TANSI_applyLang(currentLang);

    function updateNextUrl() {
      const next = form.querySelector('[name="_next"]');
      const lang = window.TANSI_currentLang || 'en';
      const url = window.location.origin + '/aceptar/gracias?lang=' + lang;
      if (next) next.value = url;
      else {
        const inp = document.createElement('input');
        inp.type = 'hidden'; inp.name = '_next'; inp.value = url;
        form.appendChild(inp);
      }
      document.querySelector('[name="_language"]').value = lang;
    }
    updateNextUrl();

    function setField(id, paramKey, previewId, formatter) {
      const val = params.get(paramKey);
      if (!val) return;
      const decoded = decodeURIComponent(val.replace(/\+/g, ' '));
      const field = document.getElementById(id);
      if (field) field.value = decoded;
      if (previewId) {
        const preview = document.getElementById(previewId);
        if (preview) preview.textContent = formatter ? formatter(decoded) : decoded;
      }
    }

    setField('field-ref', 'ref');
    setField('paquete', 'paquete', 'preview-paquete');
    setField('valor_total', 'valor', 'preview-valor', v => {
      if (v.startsWith('$')) return v;
      const n = Number(String(v).replace(/\./g, '').replace(/,/g, ''));
      return isNaN(n) ? v : '$' + n.toLocaleString('es-CO');
    });
    setField('pasajeros', 'pasajeros', 'preview-pasajeros', v => v + TANSI_I18N[currentLang].passengersSuffix);
    setField('fechas', 'fechas', 'preview-fechas');

    const ref = params.get('ref');
    if (ref) {
      document.getElementById('ref-badge').classList.remove('hidden');
      document.getElementById('ref-display').textContent = decodeURIComponent(ref);
    }

    function refreshPreviewEmpty() {
      const lang = window.TANSI_currentLang || 'en';
      ['preview-paquete','preview-valor','preview-pasajeros','preview-fechas'].forEach(id => {
        const el = document.getElementById(id);
        if (el.textContent === '—' || el.textContent === TANSI_I18N.es.previewEmpty || el.textContent === TANSI_I18N.en.previewEmpty) {
          el.textContent = TANSI_I18N[lang].previewEmpty;
        }
      });
      const pax = params.get('pasajeros');
      if (pax) document.getElementById('preview-pasajeros').textContent = decodeURIComponent(pax) + TANSI_I18N[lang].passengersSuffix;
    }
    refreshPreviewEmpty();

    document.getElementById('email').addEventListener('change', function () {
      let replyto = form.querySelector('[name="_replyto"]');
      if (!replyto) {
        replyto = document.createElement('input');
        replyto.type = 'hidden'; replyto.name = '_replyto';
        form.appendChild(replyto);
      }
      replyto.value = this.value;
    });

    form.addEventListener('submit', function () {
      document.getElementById('field-url').value = window.location.href;
      document.getElementById('field-timestamp').value = new Date().toISOString();
      document.getElementById('field-ref').value = params.get('ref') || '';
      document.getElementById('field-idioma').value = window.TANSI_currentLang || 'en';
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.querySelector('span').textContent = TANSI_I18N[window.TANSI_currentLang || 'en'].submitting;
    });
  </script>
</body>
</html>
